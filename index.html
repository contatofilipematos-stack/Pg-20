    <script>
      (function() {
        // Safe JSON.stringify wrapper to avoid circular structure errors
        const originalStringify = JSON.stringify;
        JSON.stringify = function (value, replacer, space) {
          const seen = new WeakSet();
          const customReplacer = function (key, val) {
            if (key && (key.startsWith('__react') || key.startsWith('__fiber'))) {
              return undefined;
            }
            if (val instanceof HTMLElement || val instanceof Node) {
              return "[DOM Element: " + (val.tagName || 'NODE') + "]";
            }
            if (typeof val === "object" && val !== null) {
              if (seen.has(val)) {
                return "[Circular]";
              }
              seen.add(val);
            }
            if (typeof replacer === "function") {
              return replacer(key, val);
            }
            return val;
          };
          if (Array.isArray(replacer)) {
            const allowedKeys = new Set(replacer);
            const arrayReplacer = function(key, val) {
              if (key === "") return customReplacer(key, val);
              if (!allowedKeys.has(key)) return undefined;
              return customReplacer(key, val);
            };
            return originalStringify(value, arrayReplacer, space);
          }
          return originalStringify(value, customReplacer, space);
        };

        // Safe postMessage wrapper to avoid structured clone or circular serialization errors on clicks/telemetry
        const originalPostMessage = window.postMessage;
        window.postMessage = function (message, targetOrigin, transfer) {
          try {
            originalPostMessage.call(this, message, targetOrigin, transfer);
          } catch (err) {
            try {
              const sanitized = JSON.parse(JSON.stringify(message));
              originalPostMessage.call(this, sanitized, targetOrigin, transfer);
            } catch (e) {
              console.warn("Failed to send postMessage even after sanitization:", e);
            }
          }
        };
      })();
    </script>
